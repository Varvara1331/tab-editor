<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
  <rect x="30" y="20" width="140" height="200" fill="#2a2520" stroke="#f54639" stroke-width="2" rx="4" opacity="0.9"/>
  
  <line x1="30" y1="60" x2="170" y2="60" stroke="#c1bcb2" stroke-width="1.5" opacity="0.5"/>
  <line x1="30" y1="100" x2="170" y2="100" stroke="#c1bcb2" stroke-width="1.5" opacity="0.5"/>
  <line x1="30" y1="140" x2="170" y2="140" stroke="#c1bcb2" stroke-width="1.5" opacity="0.5"/>
  <line x1="30" y1="180" x2="170" y2="180" stroke="#c1bcb2" stroke-width="1.5" opacity="0.5"/>
  
  <line x1="50" y1="20" x2="50" y2="220" stroke="#dedddc" stroke-width="2" opacity="1"/>
  <line x1="70" y1="20" x2="70" y2="220" stroke="#dedddc" stroke-width="1.8" opacity="0.9"/>
  <line x1="90" y1="20" x2="90" y2="220" stroke="#dedddc" stroke-width="1.6" opacity="0.85"/>
  <line x1="110" y1="20" x2="110" y2="220" stroke="#dedddc" stroke-width="1.4" opacity="0.8"/>
  <line x1="130" y1="20" x2="130" y2="220" stroke="#dedddc" stroke-width="1.2" opacity="0.7"/>
  <line x1="150" y1="20" x2="150" y2="220" stroke="#dedddc" stroke-width="1" opacity="0.6"/>
  
  <text x="20" y="50" font-size="10" fill="#c1bcb2" text-anchor="end" opacity="0.7">1</text>
  <text x="20" y="90" font-size="10" fill="#c1bcb2" text-anchor="end" opacity="0.7">2</text>
  <text x="20" y="130" font-size="10" fill="#c1bcb2" text-anchor="end" opacity="0.7">3</text>
  <text x="20" y="170" font-size="10" fill="#c1bcb2" text-anchor="end" opacity="0.7">4</text>
  
  <!-- E: 1 на 3 струне 1 лада (110,45) -->
  <circle cx="110" cy="45" r="9" fill="rgb(255, 255, 255)"/>
  <text x="110" y="50" font-size="15" fill="#f54639" text-anchor="middle" font-weight="bold">1</text>
  
  <!-- 2 на 4 струне 2 лада (90,85) -->
  <circle cx="90" cy="85" r="9" fill="rgb(255, 255, 255)"/>
  <text x="90" y="90" font-size="15" fill="#f54639" text-anchor="middle" font-weight="bold">3</text>
  
  <!-- 3 на 5 струне 2 лада (70,85) -->
  <circle cx="70" cy="85" r="9" fill="rgb(255, 255, 255)"/>
  <text x="70" y="90" font-size="15" fill="#f54639" text-anchor="middle" font-weight="bold">2</text>
  
  <text x="50" y="15" font-size="14" fill="#10b981" text-anchor="middle" opacity="0.9">○</text>
  <text x="130" y="15" font-size="14" fill="#10b981" text-anchor="middle" opacity="0.9">○</text>
  <text x="150" y="15" font-size="14" fill="#10b981" text-anchor="middle" opacity="0.9">○</text>
</svg>